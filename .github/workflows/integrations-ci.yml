name: integrations-ci
on:
  push:
    paths: ['integrations/**', '.github/workflows/integrations-ci.yml']
  pull_request:
    paths: ['integrations/**']
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integrations
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: integrations/pnpm-lock.yaml
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: python -m pip install -e 'packages/runner-kit-py[test]' && python -m pytest -q packages/runner-kit-py/tests
      - run: pnpm lab check-public
        env:
          LAB_DENYLIST: ${{ secrets.LAB_DENYLIST }}
